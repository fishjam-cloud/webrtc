// JitPack publishing for FishjamWebRTC (Android).
//
// JitPack builds this project from the git tag it is asked for (e.g.
// `com.github.fishjam-cloud:webrtc:v124.0.2.2` -> tag `v124.0.2.2`). It CANNOT
// compile WebRTC's native code, so this project does not build the AAR.
// Instead it downloads the prebuilt `FishjamWebRTC.aar` — produced on the build
// host with `tools_webrtc/android/build_aar.py` and attached to the matching
// GitHub release — and republishes it to the local Maven repo for JitPack to
// serve. This mirrors the iOS flow, where the podspec points at the prebuilt
// xcframework zip on the same release.
//
// Local test:  ./gradlew publishToMavenLocal -PreleaseVersion=v124.0.2.2
// On JitPack:  the `VERSION` env var (the tag) is set automatically.

plugins {
    id 'maven-publish'
}

group = 'com.github.fishjam-cloud'

def releaseVersion = (project.findProperty('releaseVersion')
        ?: System.getenv('VERSION')
        ?: 'dev').toString()
version = releaseVersion

def aarFile = layout.buildDirectory.file('outputs/FishjamWebRTC.aar')

def downloadAar = tasks.register('downloadAar') {
    def downloadUrl = "https://github.com/fishjam-cloud/webrtc/releases/download/${releaseVersion}/FishjamWebRTC.aar"
    def dest = aarFile.get().asFile
    outputs.file(dest)
    doLast {
        if (releaseVersion == 'dev') {
            throw new GradleException(
                'No version set. Pass -PreleaseVersion=vX.Y.Z.N (JitPack sets the VERSION env var automatically).')
        }
        logger.lifecycle("Downloading ${downloadUrl}")
        dest.parentFile.mkdirs()
        new URL(downloadUrl).withInputStream { input -> dest.withOutputStream { out -> out << input } }
        if (dest.length() == 0) {
            throw new GradleException("Downloaded AAR is empty: ${downloadUrl}")
        }
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = project.group.toString()
            artifactId = 'webrtc'
            version = project.version.toString()

            artifact(aarFile) {
                extension = 'aar'
                builtBy downloadAar
            }

            pom {
                packaging = 'aar'
                name = 'FishjamWebRTC'
                description = 'Prebuilt WebRTC AAR used by Fishjam (react-native-webrtc).'
                url = 'https://github.com/fishjam-cloud/webrtc'
                licenses {
                    license {
                        name = 'BSD-3-Clause'
                        url = 'https://github.com/fishjam-cloud/webrtc/blob/master/README.md'
                    }
                }
            }
        }
    }
}
